# sivmone: Fast Sila Virtual Machine implementation
# SPDX-License-Identifier: Apache-2.0

# Mirrors the release-linux job of circle.yml: the chfast/cpp-build-env:25-gcc-15
# image, a Release build with warnings as errors and testing enabled, then ctest.
# The checkout runs on the runner; configure, build and test run in the image.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  IMAGE: chfast/cpp-build-env:25-gcc-15

jobs:
  release-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build and test in ${{ env.IMAGE }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e BUILD_TYPE=Release -e CMAKE_BUILD_PARALLEL_LEVEL=4 -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/project" -w /project "$IMAGE" bash -ec '
              CC=${CC:-cc}
              CXX=${CXX:-cpp}
              echo CC: $CC
              echo CXX: $CXX
              $CC --version
              $CXX --version
              cmake --version
              cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_COMPILE_WARNING_AS_ERROR=TRUE -DEVMONE_TESTING=ON
              cmake --build build
              cd build
              ctest --schedule-random --output-on-failure --parallel $CMAKE_BUILD_PARALLEL_LEVEL
            '
