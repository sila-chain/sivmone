# sivmone: Fast Sila Virtual Machine implementation
# SPDX-License-Identifier: Apache-2.0

# Mirrors the release-linux job of circle.yml: the chfast/cpp-build-env:25-gcc-15
# image, a Release build with warnings as errors and testing enabled, then ctest.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-linux:
    runs-on: ubuntu-24.04
    container: chfast/cpp-build-env:25-gcc-15
    env:
      BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Environment
        run: |
          cmake --version
          ${CXX:-c++} --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_COMPILE_WARNING_AS_ERROR=TRUE -DEVMONE_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        working-directory: build
        run: ctest --schedule-random --output-on-failure --parallel $CMAKE_BUILD_PARALLEL_LEVEL
